; Key to trigger name.
;
; The left side is what your mouse software emits, the right side is what the
; binding list calls it. This exists purely so a binding reads as
; "logitech/forward" instead of "F13". An unmapped key still fires under its own
; name, so you can add a button first and name it later.
;
; F13 to F24 are the private channel: no keyboard has them and no application
; binds them. Ctrl+Alt+F1 to F12 are carried as well, for device software that
; will not emit the high F keys.

[triggers]
F13 = logitech/forward
F14 = logitech/back
F15 = logitech/gesture
F16 = logitech/thumb
F17 = logitech/wheel-left
F18 = logitech/wheel-right
F19 = tartarus/1
F20 = tartarus/2
F21 = tartarus/3
F22 = tartarus/4
F23 = deck/a
F24 = deck/b

Ctrl+Alt+F12 = bridge/selftest
