<style>
/* Holodex UI Lab layout. Surfaces, controls and states are the @ark/ui parts above, copied unchanged;
   this block only arranges them, mirrors apps/web-console/app/interface-lab, and every value resolves to a token. */
:root { color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--color-ground); color: var(--text-body); font-family: var(--font-ui); font-size: var(--text-size-body); }
* { box-sizing: border-box; }
body { padding-block: var(--s3); padding-left: max(var(--s4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s4), env(safe-area-inset-right, 0px)); }
.lab { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); min-width: 0; padding: var(--pad-surface); padding-inline-start: calc(var(--pad-surface) + var(--panel-edge-w)); }
.lab-header, .lab-actions { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s3); min-width: 0; }
.lab-header { justify-content: space-between; }
.lab-actions { align-items: center; }
.lab .lab-frame { height: max(calc(var(--s12) * 11), calc(100dvh - var(--s12) * 4)); }
.lab-canvas { display: grid; grid-template-rows: minmax(60%, 1fr) auto; gap: var(--s3); height: 100%; min-height: 0; padding-right: var(--s3); }
.lab-stage { min-height: 0; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
/* Stage surface: one token step above color-ground, with the viewport vignette. The dot grid lives on the board only. */
.lab-stage .rp-stage { background-color: var(--color-surface); background-image: none; }
.lab-stage .rp-stage::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: inherit; background: radial-gradient(ellipse at center, transparent 20%, color-mix(in srgb, var(--color-ground) 30%, transparent) 60%, color-mix(in srgb, var(--color-ground) 72%, transparent) 100%); box-shadow: var(--edge-vignette); }
.lab-stage .rp-stage__board { background-color: var(--color-ground); background-image: radial-gradient(color-mix(in srgb, var(--color-bone) 16%, transparent) var(--grid-dot, calc(var(--u) / 4)), transparent calc(var(--grid-dot, calc(var(--u) / 4)) * 1.5)); background-size: var(--grid-pitch, calc(var(--u) * 5.5)) var(--grid-pitch, calc(var(--u) * 5.5)); }
.lab-stage .rp-trace-beam, .lab-stage .rp-stage__label, .lab-stage .rp-stage__readout, .lab-stage .rp-marks { z-index: 2; }
.lab-page { position: absolute; box-shadow: var(--shadow-cast); border-radius: var(--radius-widget); }
.lab-hud { position: absolute; z-index: 3; top: var(--s2); right: calc(var(--s8) + var(--s2)); }
.lab-empty { display: grid; align-content: center; justify-items: start; gap: var(--s3); height: 100%; padding: var(--s6); max-width: calc(var(--s12) * 12); cursor: default; }
.lab-side { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: var(--s3); height: 100%; min-height: 0; padding: var(--s3); padding-inline-start: var(--s4); }
.lab-sidehead { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-width: 0; }
.lab-column { display: grid; align-content: start; gap: var(--s3); min-height: 0; min-width: 0; overflow-y: auto; }
#side-thread { display: flex; flex-direction: column; }
#side-thread > .rp-gala-thread, #thread-more { flex: 0 0 auto; }
.lab-facts { display: grid; gap: var(--s2); min-width: 0; }
.lab-heading { margin: 0; color: var(--text-body); font-family: var(--font-display); font-size: var(--text-size-section); overflow-wrap: anywhere; }
.lab-note { margin: 0; color: var(--color-dim); font-family: var(--font-body); font-size: var(--text-size-body); line-height: 1.5; overflow-wrap: anywhere; }
.lab-list { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--u) var(--s3); margin: 0; font-family: var(--font-mono); font-size: var(--text-size-data); }
.lab-list dt { color: var(--color-ghost); }
.lab-list dd { margin: 0; color: var(--color-bone); overflow-wrap: anywhere; }
.lab-count { color: var(--color-ghost); font-family: var(--font-mono); font-size: var(--text-size-caption); }
.lab-swatch { display: block; width: var(--s3); height: var(--s3); border: var(--border-hair) solid var(--color-line-2); border-radius: calc(var(--u) * 0.75); }
.lab-tweaks { display: grid; gap: var(--s2); margin: 0; padding: 0; list-style: none; }
.lab-tweaks li { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); color: var(--color-dim); font-family: var(--font-mono); font-size: var(--text-size-data); overflow-wrap: anywhere; }
.lab-tweaks b { color: var(--color-patina); font-weight: 400; }
.lab-tile { position: absolute; overflow: hidden; border-radius: var(--radius-inset); background: var(--color-surface); }
.lab-tile[data-dim] { opacity: 0.3; }
.lab-render { display: block; width: 100%; height: 100%; user-select: none; }
.lab-source { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s3); min-width: 0; }
.lab-cards { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.lab-brief { margin: 0; color: var(--color-dim); font-family: var(--font-mono); font-size: var(--text-size-caption); white-space: pre-wrap; overflow-wrap: anywhere; }
/* Window head, the way a Holodex window wears it: ArkMark, a mono eyebrow, and the title in the UI face. */
.lab-title { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.lab-titletext { display: grid; gap: var(--u); min-width: 0; }
.lab-h1 { margin: 0; color: var(--color-bone); font: 800 var(--text-size-section)/1.2 var(--font-ui); overflow-wrap: anywhere; }
.lab-inventory { display: grid; gap: var(--s6); min-width: 0; }
.lab-row { display: grid; gap: var(--s2); min-width: 0; }
.lab-row > .rp-eyebrow { margin: 0; font-weight: 400; }
.lab-shelf { display: flex; flex-wrap: wrap; gap: var(--s4); min-width: 0; }
/* The blueprint that rolls between a folder and the stage. */
.lab-roll { position: fixed; z-index: 50; pointer-events: none; border: var(--border-hair) solid var(--color-line); border-radius: var(--radius-btn); background-color: var(--color-ground); background-image: radial-gradient(color-mix(in srgb, var(--color-bone) 16%, transparent) calc(var(--u) / 4), transparent calc(var(--u) * 0.375)); background-size: calc(var(--u) * 5.5) calc(var(--u) * 5.5); box-shadow: inset var(--panel-edge-w) 0 0 var(--edge-agent), var(--shadow-cast); transition: left var(--dur-bloom) var(--ease-analog), top var(--dur-bloom) var(--ease-analog), width var(--dur-bloom) var(--ease-analog), height var(--dur-bloom) var(--ease-analog), opacity var(--dur-disclosure) var(--ease-analog); }

/* FolderPocket (CP-36, Concept), built to its Shell Inventory entry: folder-tab back with a token contour field, sheets,
   and a smoked-glass front on a bottom hinge with the LW-01 edge and a bone rim. Geometry is the entry's own
   (340 by 272, radius 22, 30px fan at 8deg, 16deg lean); every colour is a token. States here: entering, rest, hover,
   focus, more, and open as the edge turning patina before the roll. */
.fp-slot { --fp-s: 0.62; width: calc(340px * var(--fp-s)); height: calc(336px * var(--fp-s)); flex: none; }
.fp { --px: 0; --py: 0; --ease: var(--ease-analog); --spring: var(--ease-spring, cubic-bezier(.34, 1.36, .5, 1)); --hinge: 0deg; --edge: var(--color-line-2); --glow: 0; position: relative; width: 340px; height: 336px; transform: scale(var(--fp-s)); transform-origin: 0 0; user-select: none; -webkit-tap-highlight-color: transparent; }
.fp[data-hover] { --hinge: -16deg; }
.fp[data-open] { --edge: color-mix(in srgb, var(--color-patina) 85%, transparent); --glow: 1; }
.fp-stage { position: absolute; left: 0; top: 64px; width: 340px; height: 272px; }
.fp-folder { position: absolute; inset: 0; }
.fp-tilt { position: absolute; inset: 0; transform: perspective(1400px) rotateX(calc(var(--py) * -3deg)) rotateY(calc(var(--px) * 4deg)); transition: transform .9s var(--ease); }
.fp-shadow { position: absolute; left: 18px; right: 18px; bottom: -8px; height: 60px; border-radius: 40px; background: color-mix(in srgb, black 70%, transparent); filter: blur(22px); transform: translateX(calc(var(--px) * -8px)); transition: transform .9s var(--ease), opacity .9s var(--ease); }
.fp-back { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(180deg, var(--color-skeleton), var(--color-surface)); transform-origin: 50% 100%; }
.fp-art { position: absolute; left: -12px; top: -12px; width: 364px; height: 296px; transform: translate(calc(var(--px) * -7px), calc(var(--py) * -6px)); transition: transform 1.1s var(--ease), opacity 1.2s var(--ease); opacity: 0; }
.fp-art[data-ready] { opacity: 1; }
.fp-back-eb { position: absolute; right: 22px; top: 12px; font: 500 10px var(--font-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--color-ghost); }
.fp-rim { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; fill: none; }
.fp-back-rim { width: 340px; height: 272px; transform-origin: 50% 100%; }
.fp-back-rim path { stroke: var(--color-line-2); stroke-width: 1; }
.fp-files { position: absolute; inset: 0; z-index: 5; pointer-events: none; clip-path: inset(-400px -400px 10px -400px); }
.fp-sh { box-sizing: border-box; position: absolute; left: 92px; top: 78px; width: 156px; height: 204px; border-radius: 14px; overflow: hidden; background: linear-gradient(180deg, var(--color-skeleton), var(--color-surface-2)); box-shadow: inset 0 1px 0 color-mix(in srgb, var(--color-bone) 8%, transparent), 0 0 0 1px var(--color-line-2), 0 20px 40px color-mix(in srgb, black 50%, transparent); transform-origin: 50% 100%; transform: translate(var(--rx), var(--ry)) rotate(var(--rr)) scale(var(--ts)); transition: transform .62s var(--spring) var(--dl, 0ms), translate .9s var(--ease), opacity .9s var(--ease); }
.fp[data-hover] .fp-sh { transform: translate(var(--hx), var(--hy)) rotate(var(--hr)) scale(var(--ts)); }
.fp-sh.art { background: var(--color-ground); }
.fp-sh.art::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 90% at 22% 70%, color-mix(in srgb, var(--color-patina) 42%, transparent), transparent 62%), radial-gradient(60% 80% at 82% 30%, color-mix(in srgb, var(--color-ember) 34%, transparent), transparent 60%); }
.fp-sh.more { background: var(--color-surface); border: 1px dashed var(--color-ghost); display: grid; place-items: center; }
.fp-big { font: 900 34px var(--font-display); color: var(--color-bone); }
.fp-hd { position: absolute; left: 14px; right: 14px; top: 11px; z-index: 1; display: flex; flex-direction: column; gap: 3px; white-space: nowrap; }
.fp-nm { overflow: hidden; text-overflow: ellipsis; font: 600 12px var(--font-mono); letter-spacing: .04em; color: var(--color-bone); }
.fp-mt { font: 500 9.5px var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--color-ghost); }
.fp-sh.art .fp-mt { color: var(--color-dim); }
.fp-sh.more .fp-nm { color: var(--color-patina); }
.fp-ln { position: absolute; left: 14px; right: 14px; top: 44px; display: flex; flex-direction: column; gap: 9px; }
.fp-ln i { display: block; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--color-bone) 7%, transparent); }
.fp-ln i:first-child { height: 9px; margin-bottom: 4px; background: color-mix(in srgb, var(--color-bone) 13%, transparent); }
.fp-front { position: absolute; left: 0; top: 74px; width: 340px; height: 198px; z-index: 10; color: var(--color-bone); -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); transform-origin: 50% 100%; transform: perspective(760px) rotateX(var(--hinge)); transition: transform .8s var(--spring), translate 1s var(--ease), opacity .5s var(--ease); }
.fp-tint { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--color-surface) 20%, transparent) 0%, color-mix(in srgb, var(--color-surface) 66%, transparent) 46%, color-mix(in srgb, var(--color-ground) 95%, transparent) 100%); }
.fp-edge { position: absolute; left: 0; top: 0; bottom: 0; width: var(--panel-edge-w); background: var(--edge); transition: background .18s var(--ease); box-shadow: 0 0 calc(var(--glow) * 12px) color-mix(in srgb, var(--color-patina) calc(var(--glow) * 50%), transparent); }
.fp-wash { position: absolute; left: 0; top: 0; bottom: 0; width: 60px; background: linear-gradient(90deg, color-mix(in srgb, var(--color-patina) 16%, transparent), transparent); opacity: var(--glow); transition: opacity .3s var(--ease); }
.fp-spec { position: absolute; inset: 0; background: radial-gradient(260px 200px at calc(50% + var(--px) * 46%) calc(30% + var(--py) * 40%), color-mix(in srgb, var(--color-cream) 55%, transparent), transparent 70%); mix-blend-mode: screen; opacity: .13; pointer-events: none; }
.fp-front-rim { width: 340px; height: 198px; opacity: .5; }
.fp-front-rim path { stroke-width: 2.2; transition: stroke-width .3s var(--ease); }
.fp-hit { all: unset; position: absolute; inset: 0; z-index: 1; cursor: pointer; }
.fp-front:has(.fp-hit:focus-visible) .fp-front-rim { opacity: 1; color: var(--color-patina); }
.fp-front:has(.fp-hit:focus-visible) .fp-front-rim path { stroke-width: 3; }
.fp-lbl { position: absolute; left: 28px; right: 20px; bottom: 30px; z-index: 2; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.fp-ttl { font: 900 24px/1.05 var(--font-display); letter-spacing: -.01em; color: var(--color-bone); overflow-wrap: anywhere; }
.fp-meta { font: 500 12px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--color-dim); }
.fp:not([data-entered]) .fp-back, .fp:not([data-entered]) .fp-back-rim { translate: 0 22px; opacity: 0; }
.fp:not([data-entered]) .fp-sh { translate: 0 -140px; opacity: 0; }
.fp:not([data-entered]) .fp-front { translate: 0 46px; opacity: 0; }
.fp:not([data-entered]) .fp-shadow { opacity: 0; }
.fp-back, .fp-back-rim { transition: translate 1s var(--ease) calc(var(--fp-i) * 60ms), opacity .5s var(--ease) calc(var(--fp-i) * 60ms); }
.fp[data-entered] .fp-front { transition-delay: 0s, calc(.3s + var(--fp-i) * 60ms), calc(var(--fp-i) * 60ms); }
@media (prefers-reduced-motion: reduce) { .fp *, .fp *::before, .fp *::after { transition-duration: 0s !important; transition-delay: 0s !important; animation: none !important; } .fp-tilt { transform: none; } .lab-roll { display: none; } }
@media (max-width: 55rem) { .lab-canvas { padding-right: 0; } .fp-slot { --fp-s: 0.46; } .lab-hud { right: var(--s2); } }
</style>

<section class="rp-panel lab" id="lab" aria-label="UI Lab">
  <div class="lab-header">
    <div class="lab-title">__ARKMARK__<div class="lab-titletext"><span class="rp-eyebrow" id="eyebrow">ARKSTATION // UI LAB</span><h1 class="lab-h1" id="title">Inventory</h1></div></div>
    <div class="lab-actions" id="actions"></div>
  </div>

  <div class="lab-inventory" id="inventory"></div>

  <section class="rp-workspace-frame lab-frame" id="frame" hidden data-layout="editor" data-has-tools="false" data-inspector-hidden="false">
    <div class="rp-workspace-frame__canvas">
      <div class="lab-canvas">
        <div class="lab-stage" id="stagehost"></div>
        <div class="lab-source" id="source" role="status"></div>
      </div>
    </div>
    <aside class="rp-workspace-frame__inspector" id="inspector" aria-label="Smith thread, inspector and layers">
      <div class="lab-side">
        <div class="lab-sidehead"><div id="sideswitch"></div><button type="button" class="rp-btn rp-icon-btn" data-icon="close" id="side-close" aria-label="Close the inspector" title="Close the inspector"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"/><path d="M18 6 6 18"/></svg></button></div>
        <div class="lab-column" id="side-thread">
          <div class="rp-gala-thread" data-variant="panel">
            <header><span class="rp-eyebrow">Smith</span><h2 id="t-title">Smith thread</h2></header>
            <div class="rp-gala-thread__activity"><div class="rp-gala-thread__messages" id="msgs" role="log" aria-label="Smith conversation" aria-live="polite"></div></div>
            <div class="rp-gala-thread__feedback" id="feedback"></div>
            <form id="composer">
              <label for="ask">Message Smith</label>
              <textarea id="ask" maxlength="12000" rows="3" placeholder="Say what should change. The surface, the picked element and your pending tweaks go with it."></textarea>
              <div class="rp-gala-thread__composer-actions">
                <button type="button" class="rp-btn" id="mission">Run as mission</button>
                <button type="submit" class="rp-btn" id="send" aria-label="Send">Send</button>
              </div>
            </form>
          </div>
          <div id="thread-more"></div>
        </div>
        <div class="lab-column" id="side-inspect" hidden></div>
        <div class="lab-column" id="side-layers" hidden></div>
      </div>
    </aside>
  </section>
</section>
