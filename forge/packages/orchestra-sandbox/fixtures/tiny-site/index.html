<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox proof studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav aria-label="Main">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="book.html">Book a session</a>
      <a href="admin/">Staff</a>
    </nav>
  </header>
  <main>
    <h1>Sandbox proof studio</h1>
    <p>A tiny static site the 4GE sandbox uses to prove itself: two people click through it, and every step is recorded.</p>
    <img src="mark.svg" alt="Studio mark, a square with a circle inside" width="96" height="96">
    <button type="button" id="hours-toggle" aria-expanded="false" aria-controls="hours">Show opening hours</button>
    <p id="hours" hidden>Open Tuesday to Saturday, noon to eight.</p>
  </main>
  <script>
    const toggle = document.getElementById("hours-toggle");
    const hours = document.getElementById("hours");
    toggle.addEventListener("click", () => {
      hours.hidden = !hours.hidden;
      toggle.setAttribute("aria-expanded", String(!hours.hidden));
    });
  </script>
</body>
</html>
