# Builds Holodex on every pull request and push to master. A v* tag also publishes the self-contained
# win-x64 zip (with its SHA-256) to that tag's GitHub Release, so the test build is reproducible from source.
name: Build

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build Omniwand.csproj -c Release --disable-build-servers -p:UseSharedCompilation=false -nologo

      - name: Publish self-contained win-x64
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          dotnet publish Omniwand.csproj -c Release -r win-x64 --self-contained true -o publish --disable-build-servers -p:UseSharedCompilation=false -nologo
          Compress-Archive -Path publish\* -DestinationPath "Holodex-$version-win-x64.zip"
          (Get-FileHash "Holodex-$version-win-x64.zip" -Algorithm SHA256).Hash.ToLower() + "  Holodex-$version-win-x64.zip" | Out-File -Encoding ascii "Holodex-$version-win-x64.zip.sha256"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ github.ref_name }}"
          gh release view $version *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $version --title "Holodex $version (win-x64 Self-Contained)" --generate-notes }
          gh release upload $version "Holodex-$version-win-x64.zip" "Holodex-$version-win-x64.zip.sha256" --clobber
